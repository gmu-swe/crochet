name: 'Setup DaCapo'
description: 'Download and cache DaCapo 23.11-MR2-chopin'
outputs:
  dacapo-jar:
    description: 'Path to the dacapo jar'
    value: ${{ steps.export.outputs.dacapo-jar }}

runs:
  using: composite
  steps:
    - name: Restore DaCapo zip cache
      id: cache-zip
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/dacapo-cache/dacapo-23.11-MR2-chopin.zip
        key: dacapo-zip-23.11-MR2-chopin-v1

    - name: Download DaCapo (cache miss)
      if: steps.cache-zip.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        mkdir -p "${RUNNER_TEMP}/dacapo-cache"
        cd "${RUNNER_TEMP}/dacapo-cache"
        echo "Downloading DaCapo 23.11-MR2-chopin (6 GB) ..."
        curl -fsSL --retry 3 -o dacapo-23.11-MR2-chopin.zip \
          "https://download.dacapobench.org/chopin/dacapo-23.11-MR2-chopin.zip"
        echo "Verifying SHA-256 ..."
        echo "70a1fd4ed959f09053bb7ef8b2745a19d6f28dd8a7d0b350362039d89b49eb26  dacapo-23.11-MR2-chopin.zip" | sha256sum -c -

    - name: Extract DaCapo jar and data
      shell: bash
      run: |
        set -eu
        mkdir -p "${RUNNER_TEMP}/dacapo-unzipped"
        # Extract any *.jar from the zip into a flat staging dir.
        # The zip layout has changed across releases (e.g. the jar has appeared
        # at 'dacapo-23.11-MR2-chopin/jar/dacapo-*.jar', 'jar/dacapo-*.jar',
        # and 'dacapo-*.jar' at the root). Glob-extract is robust to all of them.
        unzip -o "${RUNNER_TEMP}/dacapo-cache/dacapo-23.11-MR2-chopin.zip" \
          '*.jar' -d "${RUNNER_TEMP}/dacapo-unzipped"
        # Find the main dacapo jar (ignore benchmark-internal jars if any).
        DACAPO_JAR_FILE=$(find "${RUNNER_TEMP}/dacapo-unzipped" -name 'dacapo-*.jar' | head -1)
        if [ -z "$DACAPO_JAR_FILE" ]; then
          echo "ERROR: no dacapo-*.jar found in zip; listing zip contents:" >&2
          unzip -l "${RUNNER_TEMP}/dacapo-cache/dacapo-23.11-MR2-chopin.zip" | head -50 >&2
          exit 1
        fi
        echo "Found DaCapo jar at: $DACAPO_JAR_FILE"
        cp "$DACAPO_JAR_FILE" "${RUNNER_TEMP}/dacapo-23.11-MR2-chopin.jar"

        # DaCapo looks for benchmark data at <jar-path-without-.jar>/dat/.
        # The jar is exported as ${RUNNER_TEMP}/dacapo-23.11-MR2-chopin.jar so
        # DaCapo will look for ${RUNNER_TEMP}/dacapo-23.11-MR2-chopin/dat/.
        # Extract the dat/ tree from the zip into that expected location.
        # We strip the leading 'dacapo-23.11-MR2-chopin/' prefix (if present)
        # using -j (junk paths) + manual mkdir so the result lands correctly.
        DATA_DIR="${RUNNER_TEMP}/dacapo-23.11-MR2-chopin"
        mkdir -p "${DATA_DIR}"
        echo "Extracting dat/ directory to ${DATA_DIR} ..."
        # The zip may contain 'dacapo-23.11-MR2-chopin/dat/...' or 'dat/...'
        # Try both; the -j flag flattens directories so we need to preserve
        # hierarchy — use -d with the target and let unzip do it.
        unzip -o "${RUNNER_TEMP}/dacapo-cache/dacapo-23.11-MR2-chopin.zip" \
          'dacapo-23.11-MR2-chopin/dat/*' -d "${RUNNER_TEMP}/dacapo-unzipped-dat" 2>/dev/null || \
        unzip -o "${RUNNER_TEMP}/dacapo-cache/dacapo-23.11-MR2-chopin.zip" \
          'dat/*' -d "${RUNNER_TEMP}/dacapo-unzipped-dat" 2>/dev/null || true
        # Find where dat/ landed and move it to the expected data dir
        DAT_SRC=$(find "${RUNNER_TEMP}/dacapo-unzipped-dat" -maxdepth 2 -name 'dat' -type d 2>/dev/null | head -1)
        if [ -n "$DAT_SRC" ]; then
          echo "Moving dat/ from $DAT_SRC to ${DATA_DIR}/dat"
          mv "$DAT_SRC" "${DATA_DIR}/dat"
        else
          echo "WARNING: dat/ directory not found in zip; -s small benchmarks may fail"
        fi

    - name: Export path
      id: export
      shell: bash
      run: |
        echo "dacapo-jar=${RUNNER_TEMP}/dacapo-23.11-MR2-chopin.jar" >> "$GITHUB_OUTPUT"
        echo "DACAPO_JAR=${RUNNER_TEMP}/dacapo-23.11-MR2-chopin.jar" >> "$GITHUB_ENV"
